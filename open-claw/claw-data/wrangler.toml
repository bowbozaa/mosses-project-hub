name = "claw-data"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
account_id = "c8a673351898eed482ae6f410e4aa118"

[vars]
AGENT_NAME = "Data Agent"
AGENT_SKILL_ID = "data_query_report"
BRAIN_API_URL = "https://flyday-brain-api.banknakorn39.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "friclawd-db"
database_id = "d2e8c736-1a8b-47d9-9d65-6142a3e15556"
migrations_dir = "migrations"

# ⚠️ migrations เป็นชุดเดียวกับ claw-guardian (แชร์ friclawd-db) — apply remote จากโปรเจกต์
# guardian เท่านั้น (dir นี้มีไว้ให้ vitest สร้างตาราง local เท่านั้น)

# secrets ที่มีบน live (คงอยู่ข้าม deploy — ห้ามใส่ค่าในไฟล์นี้):
# A2A_SHARED_KEY / GUARDIAN_URL / GUARDIAN_A2A_KEY
# หมายเหตุ: live ไม่มี BRAIN_API_KEY ตั้งอยู่ — brain_search จะยิงด้วย Bearer ว่าง (พฤติกรรมเดิม)
