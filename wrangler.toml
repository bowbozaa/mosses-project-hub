name = "mosses-project-hub"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
VERSION = "2.0.0"

# Live ecosystem inventory source — single source of truth on Cloudflare KV.
# Written/updated by the system-map tooling; read live at request time.
[[kv_namespaces]]
binding = "SYSTEM_MAP"
id = "932619f75e7b4947a77b9dd20abac334"

# เปิด logs/traces ให้ production ไม่เป็นกล่องดำ · sampling 20% คุมค่าใช้จ่าย (ตั้ง 2026-08-03)
[observability]
enabled = true
head_sampling_rate = 0.2
